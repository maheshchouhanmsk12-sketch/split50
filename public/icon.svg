<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201D38"/>
      <stop offset="100%" stop-color="#17152B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#B8F36B" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#8B83F6" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Inner Coin / Circle Symbol with Electric Lime -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="#B8F36B"/>
  </g>
  
  <!-- Modern 50 / Split Graphic in Midnight Plum -->
  <g fill="#17152B">
    <!-- Clean Minimalist S/5 Symbol -->
    <path d="M190 200 H300 V230 H220 V270 H290 C315 270 330 285 330 310 C330 335 315 350 290 350 H190 V320 H290 C296 320 300 316 300 310 C300 304 296 300 290 300 H220 C200 300 190 290 190 270 Z"/>
    <!-- Slash / 50 Divider -->
    <circle cx="340" cy="190" r="14" fill="#17152B"/>
  </g>
</svg>

