workflows:
  split50-android-apk:
    name: Split50 Android Debug APK
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      node: 22
      java: 21

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Build Web Application & Sync Capacitor
        script: |
          npm run build:android

      - name: Accept Android SDK Licenses & Prepare Gradle
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK with Gradle
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
